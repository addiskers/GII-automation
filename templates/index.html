<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage and automate GII reports with our powerful tools.">
    <meta name="keywords" content="GII Reports, Report Automation, QC, Market Reports, Automation Tools">
    <meta name="author" content="SkyQuest">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.skyquesttreports.com/">
    <title>GII QC - Manage and Automate Reports</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.5rem;
            color: #00bcd4;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
        }
        form {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        label {
            font-size: 1.1rem;
            color: #ff9800;
            display: block;
            margin-bottom: 10px;
        }
        textarea {
            background-color: #2a2a2a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
            resize: none;
        }
        textarea::placeholder {
            color: #888;
        }
        .button-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        button {
            background-color: #00bcd4;
            color: #1c1c1c;
            border: none;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            flex-grow: 1;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0097a7;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        a.button-link {
            text-decoration: none;
            background-color: #00bcd4;
            color: #1c1c1c;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1.1rem;
            text-transform: uppercase;
            text-align: center;
            transition: background-color 0.3s ease;
            display: inline-block;
        }
        a.button-link:hover {
            background-color: #0097a7;
        }
        
        /* Progress Section */
        .progress-section {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
            display: none;
        }
        
        .progress-bar-container {
            background-color: #2a2a2a;
            border-radius: 10px;
            height: 30px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #00bcd4, #0097a7);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }
        
        .progress-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }
        
        .progress-stat {
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        .progress-stat .label {
            color: #ff9800;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .progress-stat .value {
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .stop-button {
            background-color: #d32f2f !important;
            color: white !important;
            width: 100%;
        }
        
        .stop-button:hover {
            background-color: #b71c1c !important;
        }
        
        .current-url {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            word-break: break-all;
            font-size: 0.9rem;
        }
        
        .status-message {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }
        
        .status-running {
            background-color: #1976d2;
        }
        
        .status-completed {
            background-color: #388e3c;
        }
        
        .status-stopped {
            background-color: #f57c00;
        }
        
        .download-section {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-container {
            margin-top: 20px;
            padding: 15px;
            background-color: #d32f2f;
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 600px;
        }
        .error-container ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .error-container li {
            margin: 5px 0;
            word-wrap: break-word;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            form, .progress-section, .download-section {
                padding: 20px;
            }
            button {
                font-size: 1rem;
            }
            .progress-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>GII Report Automation</h1>

    <!-- Main Form -->
    <div id="main-form">
        <form method="POST" id="url-form">
            <label for="urls">Paste Links (one per line):</label>
            <textarea id="urls" name="urls" rows="10" placeholder="https://www.skyquestt.com/report/example"></textarea>
            <div class="button-container">
                <button type="button" onclick="startJob('images')">Generate Images</button>
                <button type="button" onclick="startJob('excel')">Generate Excel</button>
                <a href="/qc" class="button-link">Go to QC</a>
            </div>
        </form>
    </div>

    <!-- Progress Section -->
    <div class="progress-section" id="progress-section">
        <h3 id="progress-title">Processing...</h3>
        
        <div class="status-message" id="status-message">
            Starting job...
        </div>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar">0%</div>
        </div>
        
        <div class="progress-info">
            <div class="progress-stat">
                <div class="label">Total</div>
                <div class="value" id="total-count">0</div>
            </div>
            <div class="progress-stat">
                <div class="label">Completed</div>
                <div class="value" id="completed-count">0</div>
            </div>
            <div class="progress-stat">
                <div class="label">Failed</div>
                <div class="value" id="failed-count">0</div>
            </div>
            <div class="progress-stat">
                <div class="label">Progress</div>
                <div class="value" id="percentage">0%</div>
            </div>
        </div>
        
        <div class="current-url" id="current-url">
            <strong>Processing:</strong> <span id="current-url-text">Waiting...</span>
        </div>
        
        <button class="stop-button" id="stop-button" onclick="stopJob()">
            Stop Processing
        </button>
        
        <!-- Debug Panel (only visible during processing) -->
        <div style="margin-top: 20px; padding: 10px; background-color: #2a2a2a; border-radius: 8px; font-size: 0.9rem;">
            <div><strong>Debug Info:</strong></div>
            <div>Job ID: <span id="debug-job-id">-</span></div>
            <div>Status: <span id="debug-status">-</span></div>
            <div style="margin-top: 10px;">
                <button onclick="manualCheckProgress()" style="background-color: #666; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin-right: 10px;">Check Progress</button>
                <button onclick="forceComplete()" style="background-color: #f57c00; color: white; border: none; padding: 5px 10px; border-radius: 4px;">Force Complete</button>
            </div>
            <div style="margin-top: 5px; font-size: 0.8rem; color: #888;">
                Shortcuts: Ctrl+Shift+C (check) | Ctrl+Shift+F (force)
            </div>
        </div>
    </div>

    <!-- Download Section -->
    <div class="download-section" id="download-section">
        <h3>Download Results</h3>
        <div class="button-container" id="download-buttons">
        </div>
    </div>

    <div class="error-container" id="error-container" style="display: none;">
        <p><strong>Failed to process the following URLs:</strong></p>
        <ul id="failed-urls-list">
        </ul>
    </div>

    <script>
        let currentJobId = null;
        let progressInterval = null;
        let isJobRunning = false;

        {% if job_id %}
            currentJobId = "{{ job_id }}";
            startProgressTracking("{{ task_type }}");
        {% endif %}

        function startJob(taskType) {
            const urls = document.getElementById('urls').value.trim();
            if (!urls) {
                alert('Please enter at least one URL');
                return;
            }

            isJobRunning = true;
            document.getElementById('main-form').style.display = 'none';
            document.getElementById('progress-section').style.display = 'block';
            document.getElementById('download-section').style.display = 'none';
            document.getElementById('error-container').style.display = 'none';
            
            document.getElementById('progress-title').textContent = 
                taskType === 'images' ? 'Generating Images...' : 'Generating Excel...';

            const form = document.getElementById('url-form');
            const formData = new FormData(form);
            
            const endpoint = taskType === 'images' ? '/generate-images' : '/generate';
            
            fetch(endpoint, {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const scripts = doc.getElementsByTagName('script');
                
                for (let script of scripts) {
                    const content = script.textContent;
                    const match = content.match(/currentJobId = "([^"]+)"/);
                    if (match) {
                        currentJobId = match[1];
                        break;
                    }
                }
                
                if (currentJobId) {
                    startProgressTracking(taskType);
                } else {
                    showError('Failed to start job. Please try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('Failed to start job. Please try again.');
            });
        }

        function startProgressTracking(taskType) {
            if (!currentJobId) return;

            updateStatus('Starting job...', 'running');
            
            progressInterval = setInterval(() => {
                fetch(`/progress/${currentJobId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            console.error('Progress error:', data.error);
                            return;
                        }

                        updateProgress(data);

                        if (data.status === 'completed' || data.status === 'stopped') {
                            clearInterval(progressInterval);
                            isJobRunning = false;
                            
                            if (data.status === 'completed') {
                                showDownloadSection(data, taskType);
                                updateStatus('Job completed successfully!', 'completed');
                            } else {
                                updateStatus('Job was stopped by user', 'stopped');
                                showBackButton();
                            }
                            
                            if (data.failed_urls && data.failed_urls.length > 0) {
                                showFailedUrls(data.failed_urls);
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Progress fetch error:', error);
                    });
            }, 5000); 
        }

        function updateProgress(data) {
            document.getElementById('total-count').textContent = data.total || 0;
            document.getElementById('completed-count').textContent = data.completed || 0;
            document.getElementById('failed-count').textContent = data.failed || 0;
            document.getElementById('percentage').textContent = data.percentage + '%';
            
            document.getElementById('debug-job-id').textContent = currentJobId || '-';
            document.getElementById('debug-status').textContent = data.status || 'unknown';
            
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = data.percentage + '%';
            progressBar.textContent = data.percentage + '%';
            
            if (data.current_url) {
                document.getElementById('current-url-text').textContent = data.current_url;
            }
            
            if (data.status === 'running') {
                const taskText = data.task_type === 'images' ? 'images' : 'reports';
                updateStatus(`Processing ${taskText}... (${data.completed}/${data.total})`, 'running');
            } else if (data.status === 'completed') {
                const taskText = data.task_type === 'images' ? 'images' : 'reports';
                if (data.task_type === 'images' && data.downloaded_count) {
                    updateStatus(`Completed! Downloaded ${data.downloaded_count} images`, 'completed');
                } else {
                    updateStatus(`Completed processing ${taskText}!`, 'completed');
                }
            }
        }

        function updateStatus(message, status) {
            const statusElement = document.getElementById('status-message');
            statusElement.textContent = message;
            statusElement.className = 'status-message status-' + status;
        }

        function stopJob() {
            if (!currentJobId || !isJobRunning) return;

            fetch(`/stop/${currentJobId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateStatus('Stopping job...', 'stopped');
                    document.getElementById('stop-button').disabled = true;
                    document.getElementById('stop-button').textContent = 'Stopping...';
                } else {
                    alert('Failed to stop job: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Stop job error:', error);
                alert('Failed to stop job');
            });
        }

        function showDownloadSection(data, taskType) {
            console.log('Showing download section with data:', data); // Debug
            
            const downloadSection = document.getElementById('download-section');
            const downloadButtons = document.getElementById('download-buttons');
            
            downloadButtons.innerHTML = '';
            
            if (taskType === 'excel' && data.file_path) {
                downloadButtons.innerHTML += 
                    `<a href="/download?file_path=${encodeURIComponent(data.file_path)}" class="button-link">Download Excel File</a>`;
            }
            
            if (taskType === 'images' && data.image_zip) {
                const imageText = data.downloaded_count ? ` (${data.downloaded_count} images)` : '';
                downloadButtons.innerHTML += 
                    `<a href="/download-images?image_zip=${encodeURIComponent(data.image_zip)}" class="button-link">Download Images Zip${imageText}</a>`;
            }
            
            downloadButtons.innerHTML += 
                '<button type="button" onclick="resetForm()" style="background-color: #666; margin-top: 10px;">Process More URLs</button>';
            
            downloadSection.style.display = 'block';
            console.log('Download section should now be visible'); // Debug
        }

        function showFailedUrls(failedUrls) {
            const errorContainer = document.getElementById('error-container');
            const failedUrlsList = document.getElementById('failed-urls-list');
            
            failedUrlsList.innerHTML = '';
            failedUrls.forEach(url => {
                const li = document.createElement('li');
                li.textContent = url;
                failedUrlsList.appendChild(li);
            });
            
            errorContainer.style.display = 'block';
        }

        function showBackButton() {
            const downloadSection = document.getElementById('download-section');
            const downloadButtons = document.getElementById('download-buttons');
            
            downloadButtons.innerHTML = 
                '<button type="button" onclick="resetForm()" style="background-color: #666;">Back to Form</button>';
            
            downloadSection.style.display = 'block';
        }

        function resetForm() {
            currentJobId = null;
            isJobRunning = false;
            
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            
            document.getElementById('main-form').style.display = 'block';
            document.getElementById('progress-section').style.display = 'none';
            document.getElementById('download-section').style.display = 'none';
            document.getElementById('error-container').style.display = 'none';
            
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-bar').textContent = '0%';
            document.getElementById('stop-button').disabled = false;
            document.getElementById('stop-button').textContent = 'Stop Processing';
        }

        function showError(message) {
            alert(message);
            resetForm();
        }

        function manualCheckProgress() {
            if (!currentJobId) {
                console.log('No current job ID');
                return;
            }
            
            fetch(`/progress/${currentJobId}`)
                .then(response => response.json())
                .then(data => {
                    console.log('Manual progress check:', data);
                    if (data.status === 'completed' && (data.file_path || data.image_zip)) {
                        console.log('Job is completed but download section not shown, forcing display');
                        showDownloadSection(data, data.task_type || 'excel');
                    }
                })
                .catch(error => {
                    console.error('Manual check error:', error);
                });
        }

        function forceComplete() {
            if (!currentJobId) {
                console.log('No current job ID');
                return;
            }
            
            console.log('Forcing job completion for debugging...');
            fetch(`/force-complete/${currentJobId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                console.log('Force complete response:', data);
                if (data.success) {
                    setTimeout(manualCheckProgress, 1000);
                }
            })
            .catch(error => {
                console.error('Force complete error:', error);
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                manualCheckProgress();
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'F') {
                forceComplete();
            }
        });

        if (currentJobId) {
            document.getElementById('main-form').style.display = 'none';
            document.getElementById('progress-section').style.display = 'block';
        }
    </script>
</body>
</html>
